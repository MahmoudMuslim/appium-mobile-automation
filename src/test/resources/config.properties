# =============================================================================
# Appium / device configuration.
# Any key here can be overridden at runtime with -Dkey=value, e.g.
#   mvn test -DdeviceName=emulator-5554
#   mvn test -Dudid=RF8M123ABCD
# =============================================================================

# --- Appium server ---
appium.server.url=http://127.0.0.1:4723

# --- Emulator / device identity ---
# deviceName is shown in `adb devices` (emulator-5554) or your phone's reported name.
deviceName=emulator-5554
# udid pins a specific device when several are connected. Leave empty to auto-pick.
udid=

# --- Android platform ---
platformName=Android
# Optional: set to match your device's Android version (e.g. 13.0, 14.0).
# Leave empty to let Appium detect it.
platformVersion=
automationName=UiAutomator2

# --- Built-in app (Android Calculator, pre-installed on most AVD images) ---
# Google Calculator (default on AVD / Google images):
calculator.appPackage=com.google.android.calculator
calculator.appActivity=com.google.android.calculator.Calculator
calculator.digitIdFormat=digit_%d
calculator.addId=op_add
calculator.equalsId=eq
calculator.resultId=result
# MIUI Calculator (Xiaomi devices) - override with -D flags, e.g.:
#   -Dcalculator.appPackage=com.miui.calculator
#   -Dcalculator.appActivity=com.miui.calculator.cal.CalculatorActivity
#   -Dcalculator.equalsId=btn_equal_s
#   (the MIUI result id is also "result"; it is displayed as "= 10")

# --- Built-in app #2 (Google Clock, pre-installed on every AVD image) ---
# Used for the emulator built-in-app scenario, because Google Play AVD images
# do not always ship Google Calculator.
clock.appPackage=com.google.android.deskclock
clock.appActivity=com.android.deskclock.DeskClock

# --- Real APK under test (ApiDemos sample) ---
# Place the downloaded APK at apps/ApiDemos-debug.apk
apidemos.apkPath=apps/ApiDemos-debug.apk
apidemos.appPackage=io.appium.android.apis
apidemos.appActivity=io.appium.android.apis.ApiDemos

# --- Mobile web (Chrome) ---
chrome.url=https://www.saucedemo.com/
chrome.username=standard_user
chrome.password=secret_sauce
